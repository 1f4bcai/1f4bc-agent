name: Release reviewed agent CLI package

on:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: read

concurrency:
  group: agent-cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.19.0"
  NPM_VERSION: "11.17.0"
  MIN_DEPENDENCY_AGE_HOURS: "72"

jobs:
  authorize-release-app:
    name: Authorize the release App tag event
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require the configured release App actor and account ID
        env:
          EXPECTED_RELEASE_APP_ACTOR: ${{ vars.RELEASE_APP_ACTOR }}
          EXPECTED_RELEASE_APP_ACTOR_ID: ${{ vars.RELEASE_APP_ACTOR_ID }}
        run: |
          set -euo pipefail
          test -n "${EXPECTED_RELEASE_APP_ACTOR}"
          test -n "${EXPECTED_RELEASE_APP_ACTOR_ID}"
          test "${GITHUB_ACTOR}" = "${EXPECTED_RELEASE_APP_ACTOR}"
          test "${GITHUB_ACTOR_ID}" = "${EXPECTED_RELEASE_APP_ACTOR_ID}"
          test "${GITHUB_TRIGGERING_ACTOR}" = "${EXPECTED_RELEASE_APP_ACTOR}"

  test-reviewed-source:
    name: Test the reviewed source without release authority
    needs: authorize-release-app
    if: >-
      vars.RELEASE_APP_ACTOR != '' &&
      vars.RELEASE_APP_ACTOR_ID != '' &&
      github.actor == vars.RELEASE_APP_ACTOR &&
      github.actor_id == vars.RELEASE_APP_ACTOR_ID &&
      github.triggering_actor == vars.RELEASE_APP_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      F4BC_RELEASE_PACK_ONCE: "1"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove checkout's inert worktree config compatibility file
        shell: bash
        run: |
          set -euo pipefail
          checkout_worktree_config=".git/config.worktree"
          test -d .git
          test ! -L .git
          test -f .git/config
          test ! -L .git/config
          worktree_extension_status=0
          git config --file .git/config --no-includes --get-all extensions.worktreeConfig \
            >/dev/null 2>&1 || worktree_extension_status=$?
          test "${worktree_extension_status}" -eq 1
          if [[ -e "${checkout_worktree_config}" || -L "${checkout_worktree_config}" ]]; then
            test ! -L "${checkout_worktree_config}"
            test -f "${checkout_worktree_config}"
            test "$(stat -c '%h' "${checkout_worktree_config}")" = "1"
            worktree_size="$(stat -c '%s' "${checkout_worktree_config}")"
            [[ "${worktree_size}" =~ ^[0-9]+$ ]]
            test "${worktree_size}" -le 256
            if [[ "${worktree_size}" -gt 0 ]]; then
              worktree_parse_output="$(mktemp)"
              test -f "${worktree_parse_output}"
              test ! -L "${worktree_parse_output}"
              test "$(stat -c '%h' "${worktree_parse_output}")" = "1"
              trap 'unlink "${worktree_parse_output}"' EXIT
              worktree_parse_status=0
              git config --file "${checkout_worktree_config}" --no-includes \
                --null --list >"${worktree_parse_output}" 2>/dev/null \
                || worktree_parse_status=$?
              test "${worktree_parse_status}" -eq 0
              worktree_entries=()
              mapfile -d '' -t worktree_entries <"${worktree_parse_output}"
              unlink "${worktree_parse_output}"
              trap - EXIT
              test "${#worktree_entries[@]}" -eq 3
              seen_core_sparse_checkout=0
              seen_core_sparse_checkout_cone=0
              seen_index_sparse=0
              for worktree_entry in "${worktree_entries[@]}"; do
                case "${worktree_entry}" in
                  $'core.sparsecheckout\nfalse')
                    test "${seen_core_sparse_checkout}" -eq 0
                    seen_core_sparse_checkout=1
                    ;;
                  $'core.sparsecheckoutcone\nfalse')
                    test "${seen_core_sparse_checkout_cone}" -eq 0
                    seen_core_sparse_checkout_cone=1
                    ;;
                  $'index.sparse\nfalse')
                    test "${seen_index_sparse}" -eq 0
                    seen_index_sparse=1
                    ;;
                  *)
                    exit 1
                    ;;
                esac
              done
              test "${seen_core_sparse_checkout}" -eq 1
              test "${seen_core_sparse_checkout_cone}" -eq 1
              test "${seen_index_sparse}" -eq 1
            fi
            unlink "${checkout_worktree_config}"
          fi
          test ! -e "${checkout_worktree_config}"
          test ! -L "${checkout_worktree_config}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify source, context, and dependency gates
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "1f4bcai/1f4bc-agent"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          node packages/agent-cli/scripts/verify-release-context.mjs "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          node packages/agent-cli/scripts/release-preflight.mjs tagged-ci "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          node packages/agent-cli/scripts/verify-public-tree.mjs
          npm ci --ignore-scripts
          npm audit --workspace=@1f4bcai/agent --audit-level=low --ignore-scripts
          npm audit signatures --ignore-scripts
          node packages/agent-cli/scripts/check-release-dependencies.mjs

      - name: Run the one verified native setup script
        run: npm rebuild esbuild --foreground-scripts

      - name: Typecheck, build, and test the reviewed source
        run: |
          set -euo pipefail
          npm run typecheck --workspace=@1f4bcai/agent
          npm run build --workspace=@1f4bcai/agent
          npm test --workspace=@1f4bcai/agent

      - name: Smoke-test a disposable preliminary package
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          trap 'rm -rf -- "${probe}"' EXIT
          node packages/agent-cli/scripts/pack-release.mjs \
            --output "${probe}" \
            --git-commit "${GITHUB_SHA}"
          node packages/agent-cli/scripts/generate-release-sbom.mjs "${probe}"

  build-reviewed-artifact:
    name: Build and validate one release tarball
    needs: test-reviewed-source
    if: >-
      vars.RELEASE_APP_ACTOR != '' &&
      vars.RELEASE_APP_ACTOR_ID != '' &&
      github.actor == vars.RELEASE_APP_ACTOR &&
      github.actor_id == vars.RELEASE_APP_ACTOR_ID &&
      github.triggering_actor == vars.RELEASE_APP_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      F4BC_RELEASE_PACK_ONCE: "1"
      RELEASE_DIRECTORY: /tmp/1f4bc-agent-cli-release-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      tarball_filename: ${{ steps.release_metadata.outputs.tarball_filename }}
      tarball_sha512: ${{ steps.release_metadata.outputs.tarball_sha512 }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove checkout's inert worktree config compatibility file
        shell: bash
        run: |
          set -euo pipefail
          checkout_worktree_config=".git/config.worktree"
          test -d .git
          test ! -L .git
          test -f .git/config
          test ! -L .git/config
          worktree_extension_status=0
          git config --file .git/config --no-includes --get-all extensions.worktreeConfig \
            >/dev/null 2>&1 || worktree_extension_status=$?
          test "${worktree_extension_status}" -eq 1
          if [[ -e "${checkout_worktree_config}" || -L "${checkout_worktree_config}" ]]; then
            test ! -L "${checkout_worktree_config}"
            test -f "${checkout_worktree_config}"
            test "$(stat -c '%h' "${checkout_worktree_config}")" = "1"
            worktree_size="$(stat -c '%s' "${checkout_worktree_config}")"
            [[ "${worktree_size}" =~ ^[0-9]+$ ]]
            test "${worktree_size}" -le 256
            if [[ "${worktree_size}" -gt 0 ]]; then
              worktree_parse_output="$(mktemp)"
              test -f "${worktree_parse_output}"
              test ! -L "${worktree_parse_output}"
              test "$(stat -c '%h' "${worktree_parse_output}")" = "1"
              trap 'unlink "${worktree_parse_output}"' EXIT
              worktree_parse_status=0
              git config --file "${checkout_worktree_config}" --no-includes \
                --null --list >"${worktree_parse_output}" 2>/dev/null \
                || worktree_parse_status=$?
              test "${worktree_parse_status}" -eq 0
              worktree_entries=()
              mapfile -d '' -t worktree_entries <"${worktree_parse_output}"
              unlink "${worktree_parse_output}"
              trap - EXIT
              test "${#worktree_entries[@]}" -eq 3
              seen_core_sparse_checkout=0
              seen_core_sparse_checkout_cone=0
              seen_index_sparse=0
              for worktree_entry in "${worktree_entries[@]}"; do
                case "${worktree_entry}" in
                  $'core.sparsecheckout\nfalse')
                    test "${seen_core_sparse_checkout}" -eq 0
                    seen_core_sparse_checkout=1
                    ;;
                  $'core.sparsecheckoutcone\nfalse')
                    test "${seen_core_sparse_checkout_cone}" -eq 0
                    seen_core_sparse_checkout_cone=1
                    ;;
                  $'index.sparse\nfalse')
                    test "${seen_index_sparse}" -eq 0
                    seen_index_sparse=1
                    ;;
                  *)
                    exit 1
                    ;;
                esac
              done
              test "${seen_core_sparse_checkout}" -eq 1
              test "${seen_core_sparse_checkout_cone}" -eq 1
              test "${seen_index_sparse}" -eq 1
            fi
            unlink "${checkout_worktree_config}"
          fi
          test ! -e "${checkout_worktree_config}"
          test ! -L "${checkout_worktree_config}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify pinned release toolchain and tag
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "1f4bcai/1f4bc-agent"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          node packages/agent-cli/scripts/verify-release-context.mjs "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          node packages/agent-cli/scripts/release-preflight.mjs tagged-ci "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

      - name: Verify the minimal public tree and all reachable history
        run: node packages/agent-cli/scripts/verify-public-tree.mjs

      - name: Install the locked tree without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Gate advisories, signatures, provenance, and the bundled closure
        run: |
          set -euo pipefail
          npm audit --workspace=@1f4bcai/agent --audit-level=low --ignore-scripts
          npm audit signatures --ignore-scripts
          node packages/agent-cli/scripts/check-release-dependencies.mjs

      - name: Run the one verified native setup script
        run: npm rebuild esbuild --foreground-scripts

      - name: Final clean-build, pack once, and validate the exact artifact
        run: >-
          node packages/agent-cli/scripts/pack-release.mjs
          --output "${RELEASE_DIRECTORY}"
          --git-commit "${GITHUB_SHA}"

      - name: Extract the already-validated vendored-component SBOM without executing package code
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          mapfile -t tarballs < <(find "${RELEASE_DIRECTORY}" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tar -xOf "${tarballs[0]}" package/dist/THIRD_PARTY_COMPONENTS.cdx.json \
            > "${RELEASE_DIRECTORY}/agent-cli.cdx.json"
          digest="$(sha512sum "${RELEASE_DIRECTORY}/agent-cli.cdx.json" | cut -d' ' -f1)"
          printf '%s  agent-cli.cdx.json\n' "${digest}" \
            > "${RELEASE_DIRECTORY}/agent-cli.cdx.json.sha512"

      - name: Record immutable tarball metadata
        id: release_metadata
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find "${RELEASE_DIRECTORY}" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          filename="$(basename "${tarballs[0]}")"
          [[ "${filename}" =~ ^1f4bcai-agent-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]
          digest="$(sha512sum "${tarballs[0]}" | cut -d' ' -f1)"
          [[ "${digest}" =~ ^[0-9a-f]{128}$ ]]
          printf 'tarball_filename=%s\ntarball_sha512=%s\n' "${filename}" "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'Reviewed tarball: `%s`\n\nSHA-512: `%s`\n' "${filename}" "${digest}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the reviewed release bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-cli-${{ github.ref_name }}-reviewed
          path: ${{ env.RELEASE_DIRECTORY }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  independent-rebuild-verification:
    name: Independently rebuild and byte-compare without release authority
    needs: [test-reviewed-source, build-reviewed-artifact]
    if: >-
      vars.RELEASE_APP_ACTOR != '' &&
      vars.RELEASE_APP_ACTOR_ID != '' &&
      github.actor == vars.RELEASE_APP_ACTOR &&
      github.actor_id == vars.RELEASE_APP_ACTOR_ID &&
      github.triggering_actor == vars.RELEASE_APP_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
      F4BC_RELEASE_PACK_ONCE: "1"
      RELEASE_DIRECTORY: /tmp/1f4bc-agent-cli-reviewed-${{ github.run_id }}-${{ github.run_attempt }}
      INDEPENDENT_DIRECTORY: /tmp/1f4bc-agent-cli-independent-${{ github.run_id }}-${{ github.run_attempt }}
      REVIEWED_SHA512: ${{ needs.build-reviewed-artifact.outputs.tarball_sha512 }}
      REVIEWED_TARBALL: ${{ needs.build-reviewed-artifact.outputs.tarball_filename }}
    outputs:
      verified_sha512: ${{ steps.verify.outputs.verified_sha512 }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Remove checkout's inert worktree config compatibility file
        shell: bash
        run: |
          set -euo pipefail
          checkout_worktree_config=".git/config.worktree"
          test -d .git
          test ! -L .git
          test -f .git/config
          test ! -L .git/config
          worktree_extension_status=0
          git config --file .git/config --no-includes --get-all extensions.worktreeConfig \
            >/dev/null 2>&1 || worktree_extension_status=$?
          test "${worktree_extension_status}" -eq 1
          if [[ -e "${checkout_worktree_config}" || -L "${checkout_worktree_config}" ]]; then
            test ! -L "${checkout_worktree_config}"
            test -f "${checkout_worktree_config}"
            test "$(stat -c '%h' "${checkout_worktree_config}")" = "1"
            worktree_size="$(stat -c '%s' "${checkout_worktree_config}")"
            [[ "${worktree_size}" =~ ^[0-9]+$ ]]
            test "${worktree_size}" -le 256
            if [[ "${worktree_size}" -gt 0 ]]; then
              worktree_parse_output="$(mktemp)"
              test -f "${worktree_parse_output}"
              test ! -L "${worktree_parse_output}"
              test "$(stat -c '%h' "${worktree_parse_output}")" = "1"
              trap 'unlink "${worktree_parse_output}"' EXIT
              worktree_parse_status=0
              git config --file "${checkout_worktree_config}" --no-includes \
                --null --list >"${worktree_parse_output}" 2>/dev/null \
                || worktree_parse_status=$?
              test "${worktree_parse_status}" -eq 0
              worktree_entries=()
              mapfile -d '' -t worktree_entries <"${worktree_parse_output}"
              unlink "${worktree_parse_output}"
              trap - EXIT
              test "${#worktree_entries[@]}" -eq 3
              seen_core_sparse_checkout=0
              seen_core_sparse_checkout_cone=0
              seen_index_sparse=0
              for worktree_entry in "${worktree_entries[@]}"; do
                case "${worktree_entry}" in
                  $'core.sparsecheckout\nfalse')
                    test "${seen_core_sparse_checkout}" -eq 0
                    seen_core_sparse_checkout=1
                    ;;
                  $'core.sparsecheckoutcone\nfalse')
                    test "${seen_core_sparse_checkout_cone}" -eq 0
                    seen_core_sparse_checkout_cone=1
                    ;;
                  $'index.sparse\nfalse')
                    test "${seen_index_sparse}" -eq 0
                    seen_index_sparse=1
                    ;;
                  *)
                    exit 1
                    ;;
                esac
              done
              test "${seen_core_sparse_checkout}" -eq 1
              test "${seen_core_sparse_checkout_cone}" -eq 1
              test "${seen_index_sparse}" -eq 1
            fi
            unlink "${checkout_worktree_config}"
          fi
          test ! -e "${checkout_worktree_config}"
          test ! -L "${checkout_worktree_config}"

      - name: Set up pinned Node.js without a package cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify pinned context and toolchain
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "1f4bcai/1f4bc-agent"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          node packages/agent-cli/scripts/verify-release-context.mjs "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          node packages/agent-cli/scripts/release-preflight.mjs tagged-ci "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

      - name: Verify the minimal public tree and all reachable history
        run: node packages/agent-cli/scripts/verify-public-tree.mjs

      - name: Install and gate the locked tree without lifecycle scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --workspace=@1f4bcai/agent --audit-level=low --ignore-scripts
          npm audit signatures --ignore-scripts
          node packages/agent-cli/scripts/check-release-dependencies.mjs

      - name: Run the one independently verified native setup script
        run: npm rebuild esbuild --foreground-scripts

      - name: Independently final clean-build, pack, and validate
        run: >-
          node packages/agent-cli/scripts/pack-release.mjs
          --output "${INDEPENDENT_DIRECTORY}"
          --git-commit "${GITHUB_SHA}"

      - name: Download the reviewed bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-reviewed-artifact.outputs.artifact_id }}
          path: ${{ env.RELEASE_DIRECTORY }}

      - name: Byte-compare the two independently packed artifacts
        id: verify
        run: |
          set -euo pipefail
          [[ "${REVIEWED_TARBALL}" =~ ^1f4bcai-agent-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]
          [[ "${REVIEWED_SHA512}" =~ ^[0-9a-f]{128}$ ]]
          echo "${REVIEWED_SHA512}  ${RELEASE_DIRECTORY}/${REVIEWED_TARBALL}" | sha512sum --check --strict
          mapfile -t independent < <(find "${INDEPENDENT_DIRECTORY}" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#independent[@]}" -eq 1
          test "$(basename "${independent[0]}")" = "${REVIEWED_TARBALL}"
          test "$(sha512sum "${independent[0]}" | cut -d' ' -f1)" = "${REVIEWED_SHA512}"
          cmp --silent "${independent[0]}" "${RELEASE_DIRECTORY}/${REVIEWED_TARBALL}"
          printf 'verified_sha512=%s\n' "${REVIEWED_SHA512}" >> "${GITHUB_OUTPUT}"
          printf 'Independent rebuild matched SHA-512 `%s`.\n' "${REVIEWED_SHA512}" >> "${GITHUB_STEP_SUMMARY}"

  exact-artifact-consumer-verification:
    name: Exercise the exact reviewed artifact without release authority
    needs: [build-reviewed-artifact, independent-rebuild-verification]
    if: >-
      vars.RELEASE_APP_ACTOR != '' &&
      vars.RELEASE_APP_ACTOR_ID != '' &&
      github.actor == vars.RELEASE_APP_ACTOR &&
      github.actor_id == vars.RELEASE_APP_ACTOR_ID &&
      github.triggering_actor == vars.RELEASE_APP_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      ARTIFACT_ID: ${{ needs.build-reviewed-artifact.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.build-reviewed-artifact.outputs.artifact_digest }}
      TARBALL_FILENAME: ${{ needs.build-reviewed-artifact.outputs.tarball_filename }}
      TARBALL_SHA512: ${{ needs.build-reviewed-artifact.outputs.tarball_sha512 }}
      INDEPENDENT_SHA512: ${{ needs.independent-rebuild-verification.outputs.verified_sha512 }}
      NODE_ARCHIVE_SHA256: 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
      NODE20_ARCHIVE_SHA256: 2dd1f5c0e01732024ba1f5de4517fa3976eb0976fa7976ff687ec09b62dd73fa
      TYPESCRIPT_TARBALL_SHA512: f0561abbdea8dcd28e85b8ca8bfa8dbc6fd6e63873c646dd9b9b23f406d9ff94f9b16aa7de12602df1b1dbbb11299593bf2cc23fc74b4414dfe6d05349155434
      TYPESCRIPT_LINUX_X64_TARBALL_SHA512: 11875fd9c360eeb8025899f109d27e177577f4ef2285bdfb78702ed4b2bca00162ce04d06cf38aef31c75db3edf2b5f6e023aa3835de237b087f47c25c6ec7fc
      RELEASE_DIRECTORY: /tmp/1f4bc-agent-cli-consumer-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      verified_sha512: ${{ steps.consumer.outputs.verified_sha512 }}
    steps:
      # No checkout or repository script is accepted here. The job downloads
      # the original immutable artifact by ID and never uploads a replacement.
      - name: Download and verify the original reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          [[ "${TARBALL_FILENAME}" =~ ^1f4bcai-agent-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]
          [[ "${TARBALL_SHA512}" =~ ^[0-9a-f]{128}$ ]]
          test "${TARBALL_SHA512}" = "${INDEPENDENT_SHA512}"
          mkdir -p "${RELEASE_DIRECTORY}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "${RELEASE_DIRECTORY}/artifact.zip"
          echo "${ARTIFACT_DIGEST#sha256:}  ${RELEASE_DIRECTORY}/artifact.zip" | sha256sum --check --strict
          mapfile -t members < <(unzip -Z1 "${RELEASE_DIRECTORY}/artifact.zip" | sort)
          expected=(
            agent-cli.cdx.json
            agent-cli.cdx.json.sha512
            npm-pack.json
            release-manifest.json
            "${TARBALL_FILENAME}"
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${members[*]}" = "${expected[*]}"
          unzip -q "${RELEASE_DIRECTORY}/artifact.zip" -d "${RELEASE_DIRECTORY}/bundle"
          echo "${TARBALL_SHA512}  ${RELEASE_DIRECTORY}/bundle/${TARBALL_FILENAME}" | sha512sum --check --strict

      - name: Install the hash-pinned consumer toolchain
        run: |
          set -euo pipefail
          node_archive="${RELEASE_DIRECTORY}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            --output "${node_archive}"
          echo "${NODE_ARCHIVE_SHA256}  ${node_archive}" | sha256sum --check --strict
          tar -xJf "${node_archive}" -C "${RELEASE_DIRECTORY}"
          node20_archive="${RELEASE_DIRECTORY}/node-v20.3.0-linux-x64.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://nodejs.org/dist/v20.3.0/node-v20.3.0-linux-x64.tar.xz' \
            --output "${node20_archive}"
          echo "${NODE20_ARCHIVE_SHA256}  ${node20_archive}" | sha256sum --check --strict
          tar -xJf "${node20_archive}" -C "${RELEASE_DIRECTORY}"
          typescript_archive="${RELEASE_DIRECTORY}/typescript-7.0.2.tgz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            'https://registry.npmjs.org/typescript/-/typescript-7.0.2.tgz' \
            --output "${typescript_archive}"
          echo "${TYPESCRIPT_TARBALL_SHA512}  ${typescript_archive}" | sha512sum --check --strict
          typescript_linux_archive="${RELEASE_DIRECTORY}/typescript-linux-x64-7.0.2.tgz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            'https://registry.npmjs.org/@typescript/typescript-linux-x64/-/typescript-linux-x64-7.0.2.tgz' \
            --output "${typescript_linux_archive}"
          echo "${TYPESCRIPT_LINUX_X64_TARBALL_SHA512}  ${typescript_linux_archive}" | sha512sum --check --strict
          compiler_modules="${RELEASE_DIRECTORY}/consumer-compiler/node_modules"
          mkdir -p \
            "${compiler_modules}/typescript" \
            "${compiler_modules}/@typescript/typescript-linux-x64"
          tar -xzf "${typescript_archive}" --strip-components=1 \
            -C "${compiler_modules}/typescript"
          tar -xzf "${typescript_linux_archive}" --strip-components=1 \
            -C "${compiler_modules}/@typescript/typescript-linux-x64"

      - name: Install, execute, import, and typecheck the exact tarball
        id: consumer
        run: |
          set -euo pipefail
          toolchain="${RELEASE_DIRECTORY}/node-v${NODE_VERSION}-linux-x64/bin"
          node_bin="${toolchain}/node"
          node20_bin="${RELEASE_DIRECTORY}/node-v20.3.0-linux-x64/bin/node"
          npm_cli="${RELEASE_DIRECTORY}/node-v${NODE_VERSION}-linux-x64/lib/node_modules/npm/bin/npm-cli.js"
          test "$("${node_bin}" --version)" = "v${NODE_VERSION}"
          test "$("${node20_bin}" --version)" = 'v20.3.0'
          test "$("${node_bin}" "${npm_cli}" --version)" = "${NPM_VERSION}"
          consumer="${RELEASE_DIRECTORY}/fresh-consumer"
          mkdir "${consumer}"
          printf '%s\n' '{"name":"1f4bc-release-consumer","private":true,"type":"module"}' > "${consumer}/package.json"
          cd "${consumer}"
          "${node_bin}" "${npm_cli}" install \
            --ignore-scripts --offline --no-audit --no-fund --package-lock=false \
            --cache "${RELEASE_DIRECTORY}/empty-npm-cache" \
            "${RELEASE_DIRECTORY}/bundle/${TARBALL_FILENAME}"
          "${node_bin}" node_modules/@1f4bcai/agent/dist/index.js --help > help-node24.txt
          "${node20_bin}" node_modules/@1f4bcai/agent/dist/index.js --help > help-node20.txt
          for help in help-node24.txt help-node20.txt; do
            grep -F 'post <job.json>' "${help}"
            grep -F 'pay <https-url> --amount-atomic N --pay-to 0x...' "${help}"
          done
          cat > verify-imports.mjs <<'NODE'
          const expectations = new Map([
            ['@1f4bcai/agent', ['main', 'runCli']],
            ['@1f4bcai/agent/api', ['AgentApi', 'createSigningFetch']],
            ['@1f4bcai/agent/mcp', ['createAgentMcpServer', 'runAgentMcp']],
            ['@1f4bcai/agent/spend-policy', ['SpendGuard', 'claimAuthorizedPaymentControl']],
            ['@1f4bcai/agent/peer-payments', ['PeerPaymentClient', 'inspectUsdcReceipt']],
          ])
          for (const [specifier, names] of expectations) {
            const module = await import(specifier)
            for (const name of names) {
              if (!(name in module)) throw new Error(`${specifier} does not export ${name}`)
            }
          }
          for (const specifier of [
            '@1f4bcai/agent/terminal-clear',
            '@1f4bcai/agent/dist/runtime.js',
          ]) {
            try {
              await import(specifier)
              throw new Error(`${specifier} unexpectedly exposed a private module`)
            } catch (error) {
              if (error?.code !== 'ERR_PACKAGE_PATH_NOT_EXPORTED') throw error
            }
          }
          NODE
          "${node_bin}" verify-imports.mjs
          "${node20_bin}" verify-imports.mjs
          cat > consumer.mts <<'TYPESCRIPT'
          import { AgentApi } from '@1f4bcai/agent/api'
          import { createAgentMcpServer } from '@1f4bcai/agent/mcp'
          import { SpendGuard, type SpendControl } from '@1f4bcai/agent/spend-policy'
          import { PeerPaymentClient } from '@1f4bcai/agent/peer-payments'
          const values: [typeof AgentApi, typeof createAgentMcpServer, typeof SpendGuard, typeof PeerPaymentClient] =
            [AgentApi, createAgentMcpServer, SpendGuard, PeerPaymentClient]
          declare const control: SpendControl
          void values
          void control
          TYPESCRIPT
          "${node_bin}" "${RELEASE_DIRECTORY}/consumer-compiler/node_modules/typescript/lib/tsc.js" \
            --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext consumer.mts
          printf 'verified_sha512=%s\n' "${TARBALL_SHA512}" >> "${GITHUB_OUTPUT}"
          printf 'The exact reviewed tarball passed clean-consumer execution, import, and type checks.\n' >> "${GITHUB_STEP_SUMMARY}"

  stage-reviewed-artifact:
    name: Approve and stage the exact reviewed tarball (OIDC only)
    needs: [build-reviewed-artifact, independent-rebuild-verification, exact-artifact-consumer-verification]
    if: >-
      vars.RELEASE_APP_ACTOR != '' &&
      vars.RELEASE_APP_ACTOR_ID != '' &&
      github.actor == vars.RELEASE_APP_ACTOR &&
      github.actor_id == vars.RELEASE_APP_ACTOR_ID &&
      github.triggering_actor == vars.RELEASE_APP_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-agent-release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ARTIFACT_ID: ${{ needs.build-reviewed-artifact.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.build-reviewed-artifact.outputs.artifact_digest }}
      TARBALL_FILENAME: ${{ needs.build-reviewed-artifact.outputs.tarball_filename }}
      TARBALL_SHA512: ${{ needs.build-reviewed-artifact.outputs.tarball_sha512 }}
      INDEPENDENT_SHA512: ${{ needs.independent-rebuild-verification.outputs.verified_sha512 }}
      CONSUMER_SHA512: ${{ needs.exact-artifact-consumer-verification.outputs.verified_sha512 }}
      NODE_ARCHIVE_SHA256: 14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
      RELEASE_DIRECTORY: /tmp/1f4bc-agent-cli-stage-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # This token-capable job deliberately performs no checkout, action
      # execution, install, build, test, or repository-script execution.
      - name: Download and verify the reviewed GitHub artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          [[ "${TARBALL_FILENAME}" =~ ^1f4bcai-agent-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]
          [[ "${TARBALL_SHA512}" =~ ^[0-9a-f]{128}$ ]]
          test "${TARBALL_SHA512}" = "${INDEPENDENT_SHA512}"
          test "${TARBALL_SHA512}" = "${CONSUMER_SHA512}"
          mkdir -p "${RELEASE_DIRECTORY}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "${RELEASE_DIRECTORY}/artifact.zip"
          echo "${ARTIFACT_DIGEST#sha256:}  ${RELEASE_DIRECTORY}/artifact.zip" | sha256sum --check --strict
          mapfile -t members < <(unzip -Z1 "${RELEASE_DIRECTORY}/artifact.zip" | sort)
          expected=(
            agent-cli.cdx.json
            agent-cli.cdx.json.sha512
            npm-pack.json
            release-manifest.json
            "${TARBALL_FILENAME}"
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${members[*]}" = "${expected[*]}"
          unzip -q "${RELEASE_DIRECTORY}/artifact.zip" -d "${RELEASE_DIRECTORY}/bundle"
          echo "${TARBALL_SHA512}  ${RELEASE_DIRECTORY}/bundle/${TARBALL_FILENAME}" | sha512sum --check --strict

      - name: Install the hash-pinned official Node and npm release toolchain
        run: |
          set -euo pipefail
          archive="${RELEASE_DIRECTORY}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" \
            --output "${archive}"
          echo "${NODE_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "${archive}" -C "${RELEASE_DIRECTORY}"
          toolchain="${RELEASE_DIRECTORY}/node-v${NODE_VERSION}-linux-x64/bin"
          npm_cli="${RELEASE_DIRECTORY}/node-v${NODE_VERSION}-linux-x64/lib/node_modules/npm/bin/npm-cli.js"
          test "$("${toolchain}/node" --version)" = "v${NODE_VERSION}"
          test "$("${toolchain}/node" -p 'process.execPath')" = "${toolchain}/node"
          test "$("${toolchain}/node" "${npm_cli}" --version)" = "${NPM_VERSION}"
          printf 'NODE_BIN=%s\nNPM_CLI=%s\n' "${toolchain}/node" "${npm_cli}" >> "${GITHUB_ENV}"

      - name: Stage the reviewed tarball for separate human 2FA approval
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "1f4bcai/1f4bc-agent"
          test "${GITHUB_REF_TYPE}" = "tag"
          version="${TARBALL_FILENAME#1f4bcai-agent-}"
          version="${version%.tgz}"
          test "${GITHUB_REF_NAME}" = "agent-v${version}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          registry_status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --max-time 10 \
            --output /dev/null \
            --write-out '%{http_code}' \
            "https://registry.npmjs.org/%401f4bcai%2Fagent/${version}")"
          test "${registry_status}" = '404'
          test "$("${NODE_BIN}" -p 'process.execPath')" = "${NODE_BIN}"
          test "$("${NODE_BIN}" "${NPM_CLI}" --version)" = "${NPM_VERSION}"
          "${NODE_BIN}" "${NPM_CLI}" stage publish \
            "${RELEASE_DIRECTORY}/bundle/${TARBALL_FILENAME}" \
            --access public \
            --provenance \
            --ignore-scripts \
            --registry https://registry.npmjs.org/
          printf 'The exact reviewed tarball was staged. Inspect it on npm, then approve it separately with 2FA.\n' >> "${GITHUB_STEP_SUMMARY}"
